name: Deploy manual

# This workflow file exists only on `docs-site`, and it triggers only on pushes
# to `docs-site`. GitHub evaluates the workflow files present in the ref that
# received the push, so this runs from this branch's own copy. A copy of this
# file on `main` would never fire, because of the branch filter below.
#
# `workflow_dispatch` is deliberately absent. GitHub only offers manual dispatch
# for a workflow whose file exists on the *default* branch, so declaring it here
# would add a button that never appears. To redeploy without a new commit:
#
#     gh run rerun <run-id>
#
# which re-runs the same commit, which is what "redeploy" means.

on:
  push:
    branches: [docs-site]

# Mandatory, not decorative. This repository's default workflow permissions are
# `read`, so without this block the `gh-deploy` push to `gh-pages` fails with
# "Resource not accessible by integration".
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The manual documents a command surface that lives on `main`. `docs-site` is
  # an orphan branch: it shares no history with `main`, so `git merge` cannot
  # surface a renamed flag and no automatic means exists to notice one. This job
  # is that means.
  #
  # Its honest limits, stated rather than left to be discovered: it is a name
  # check, not a correctness check. It catches a flag that was added or renamed
  # and not written down. It does not catch a flag whose *meaning* changed while
  # its name did not, and it does not check that a documented default is still
  # the default. Passing means "nothing is undocumented", not "the manual is
  # right".
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: src-main

      - name: Every CLI flag is named in the manual
        run: |
          set -eu

          # Field names are the flag names (clap derives `--max-steps` from
          # `max_steps`), except where `long = "…"` overrides them. Both forms
          # are handled; an attribute is followed by its field on the next line.
          awk '
            pending {
              if ($0 ~ /^[[:space:]]*[a-z_]+:/) {
                n = $1; sub(/:$/, "", n); gsub(/_/, "-", n); print "--" n
              }
              pending = 0; next
            }
            /#\[arg\(/ && /long/ {
              if (match($0, /long = "[a-z-]+"/)) {
                print "--" substr($0, RSTART + 8, RLENGTH - 9)
              } else {
                pending = 1
              }
            }
          ' src-main/crates/yu-cli/src/main.rs | sort -u > /tmp/flags.txt

          if [ ! -s /tmp/flags.txt ]; then
            echo "extracted no flags — the extraction, not the manual, is broken"
            exit 1
          fi

          echo "declared on main:"
          sed 's/^/  /' /tmp/flags.txt

          missing=0
          while read -r flag; do
            if ! grep -rq -- "${flag#--}" docs/; then
              echo "UNDOCUMENTED: $flag"
              missing=1
            fi
          done < /tmp/flags.txt

          if [ "$missing" -ne 0 ]; then
            echo
            echo "The command surface changed on main and the manual did not."
            echo "Update docs/ on this branch, then push again."
            exit 1
          fi

          echo "every declared flag is named in the manual"

  deploy:
    needs: drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      # --strict promotes every warning to an error. It is safe here only
      # because the same command is run locally before a push; adopting it blind
      # in CI turns a cosmetic warning into a blocked deploy.
      - run: python -m mkdocs build --strict

      # ghp-import reads the committer identity from GIT_COMMITTER_NAME/EMAIL,
      # falling back to `git config user.*`. A fresh runner has neither.
      - name: git identity for ghp-import
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - run: python -m mkdocs gh-deploy --force
