[package]
name = "yu-cli"
description = "Front end and the short-path bypass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "yu"
path = "src/main.rs"

[dependencies]
yu-core = { workspace = true }
yu-journal = { workspace = true }
yu-observe = { workspace = true }
yu-policy = { workspace = true }
yu-server = { workspace = true }
yu-tools = { workspace = true }
yu-wire = { workspace = true }
yu-workflow = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Integration tests here drive the real binary and, for the daemon, speak the
# real protocol over a real socket — so they need the net and process halves of
# tokio, which the binary itself does not.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "process"] }
